name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spektrum
          POSTGRES_PASSWORD: spektrum
          POSTGRES_DB: spektrum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spektrum -d spektrum"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases + citext
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for db in spektrum_test spektrum_unit; do
            PGPASSWORD=spektrum psql -h localhost -U spektrum -d postgres \
              -c "CREATE DATABASE $db" || true
            PGPASSWORD=spektrum psql -h localhost -U spektrum -d "$db" \
              -c "CREATE EXTENSION IF NOT EXISTS citext"
          done
      - name: Migrate unit DB
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_unit
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spektrum
          POSTGRES_PASSWORD: spektrum
          POSTGRES_DB: spektrum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spektrum -d spektrum"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create + migrate e2e database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=spektrum psql -h localhost -U spektrum -d postgres \
            -c "CREATE DATABASE spektrum_test" || true
          PGPASSWORD=spektrum psql -h localhost -U spektrum -d spektrum_test \
            -c "CREATE EXTENSION IF NOT EXISTS citext"
          pnpm db:migrate
        env:
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
      - name: Seed e2e owner
        run: pnpm --filter @spektrum/web exec tsx src/cli/ci-seed.ts
        env:
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
      - run: pnpm --filter @spektrum/web build
      - run: pnpm test:e2e
        env:
          # `next start` runs with NODE_ENV=production, where the editor
          # deliberately exposes no test handle (`__spektrum_editor`), so the
          # suite runs against the dev server — the same way it is run locally.
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
          E2E_DB_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
      - run: pnpm test:ai
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
          E2E_DB_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
          LLM_KEY_ENCRYPTION_SECRET: e2e-key-encryption-secret-32ch!x

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spektrum
          POSTGRES_PASSWORD: spektrum
          POSTGRES_DB: spektrum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spektrum -d spektrum"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start SeaweedFS (S3 API)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -p 9333:9333 \
            chrislusf/seaweedfs:latest@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0 server -dir=/data -s3 -s3.port=8333
          # The port answering means nothing: SeaweedFS also has to have a
          # *volume node* before it can store anything. Ask the master to assign
          # in the bucket we care about and restart the store if it cannot.
          for i in $(seq 1 20); do
            if curl -fsS "http://localhost:9333/dir/assign?collection=spektrum-pdf" 2>/dev/null | grep -q '"fid"'; then
              echo "object store can assign volumes"
              exit 0
            fi
            echo "store not ready (attempt $i); restarting it" >&2
            docker restart seaweedfs >/dev/null
            sleep 5
          done
          echo "object store never became writable" >&2
          exit 1
      - name: Create the buckets
        run: |
          # `ensureBucket` throws on a not-yet-ready store; retry rather than
          # failing the job on a cold start.
          for i in $(seq 1 20); do
            pnpm --filter @spektrum/web exec tsx src/cli/ensure-buckets.ts && \
              pnpm --filter @spektrum/web exec tsx src/cli/s3-probe.ts && exit 0
            echo "object store attempt $i failed; retrying" >&2
            sleep 3
          done
          exit 1
        env:
          S3_ENDPOINT: http://localhost:8333
          S3_BUCKET: spektrum-uploads
          S3_SECRET_KEY: spektrum-secret
          S3_ACCESS_KEY: spektrum
      - name: Build the texlive image
        run: docker build -t spektrum-texlive:dev docker/texlive
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Create + migrate the compile database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=spektrum psql -h localhost -U spektrum -d postgres \
            -c "CREATE DATABASE spektrum_test" || true
          PGPASSWORD=spektrum psql -h localhost -U spektrum -d spektrum_test \
            -c "CREATE EXTENSION IF NOT EXISTS citext"
          pnpm db:migrate
        env:
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
      - name: Seed the compile owner
        run: pnpm --filter @spektrum/web exec tsx src/cli/ci-seed.ts
        env:
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
      - name: Compile e2e
        run: pnpm exec playwright test --config playwright.compile.config.ts e2e/compile.spec.ts --max-failures=1
        env:
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:8333
          S3_BUCKET: spektrum-uploads
          S3_PDF_BUCKET: spektrum-pdf
          S3_ACCESS_KEY: spektrum
          S3_SECRET_KEY: spektrum-secret
          BETTER_AUTH_SECRET: ci-secret-32-chars-minimum!!!!!!
          BETTER_AUTH_URL: http://localhost:3000
          LLM_KEY_ENCRYPTION_SECRET: ci-key-encryption-secret-32ch!!!
      - name: Compile diagnostics
        if: always()
        timeout-minutes: 3
        run: pnpm exec tsx scripts/compile-diagnostics.ts
        env:
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
          REDIS_URL: redis://localhost:6379
      - name: Object store log
        # An S3 500 means the store rejected the request; its own log is the only
        # place that says why.
        if: always()
        run: docker logs --tail 60 seaweedfs 2>&1 || true
        env:
          DATABASE_URL: postgres://spektrum:spektrum@localhost:5432/spektrum_test
          REDIS_URL: redis://localhost:6379

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The reference deployment kit has to be buildable, not just documented.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f docker/Dockerfile.web -t spektrum-web:ci .
      - run: docker build -f docker/Dockerfile.worker -t spektrum-worker:ci .
      - run: docker build -f docker/migrate.Dockerfile -t spektrum-migrate:ci .
