name: spektrum-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: spektrum-postgres
    environment:
      POSTGRES_USER: spektrum
      POSTGRES_PASSWORD: spektrum
      POSTGRES_DB: spektrum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spektrum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spektrum -d spektrum"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: spektrum-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - spektrum-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object store. MinIO's images were withdrawn from Docker Hub
  # and quay.io now requires auth, so dev and prod share SeaweedFS. The app
  # talks to it through the same S3 client (path-style).
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: spektrum-seaweedfs
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - spektrum-seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8333/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  spektrum-postgres-data:
  spektrum-redis-data:
  spektrum-seaweedfs-data:
