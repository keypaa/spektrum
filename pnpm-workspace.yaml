packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  # Source-map upload CLI; reviewed and deliberately not built (we do not upload
  # maps from inside the image). Listing it keeps `pnpm install` green in CI,
  # where an unclassified ignored build is an error.
  '@sentry/cli': false

# Security overrides for transitive dependencies (pnpm 12 reads these from
# pnpm-workspace.yaml, not package.json).
minimumReleaseAgeExclude:
  - dompurify@3.4.18
overrides:
  dompurify: 3.4.18
  rollup: 3.30.0
