packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  msgpackr-extract: true

# Security overrides for transitive dependencies (pnpm 12 reads these from
# pnpm-workspace.yaml, not package.json).
minimumReleaseAgeExclude:
  - dompurify@3.4.18
overrides:
  dompurify: 3.4.18
  rollup: 3.30.0
